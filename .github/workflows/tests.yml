name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - statamic: '^5.0'
            php: '8.3'
          - statamic: '^6.0'
            php: '8.4'
    name: Statamic ${{ matrix.statamic }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction
      - run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
